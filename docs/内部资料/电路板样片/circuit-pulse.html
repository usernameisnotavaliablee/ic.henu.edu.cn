<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <title>主板光波 · 精细构图 v0.2</title>
  <style>
    :root {
      --blue: #4474c2;
      --paper: #0a0a0a;
      --ink: #d7d7d7;
      --muted: #929292;
      --line: #303030;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, summary, input { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 5px; }
    main {
      width: min(100%, 1520px);
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(16px, 3vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-block: 0 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: .12em; }
    .caption p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .05em; }
    figure { margin: 0; }
    .stage { position: relative; aspect-ratio: 16 / 9; margin-block: 20px; }
    canvas { display: block; width: 100%; height: 100%; }
    canvas[hidden] { display: none; }
    .fallback { padding: 24px; color: var(--ink); line-height: 1.8; }
    .fallback:not([hidden]) { position: absolute; inset: 0; background: #171717; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 24px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .status { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.8; text-wrap: pretty; }
    .controls { display: flex; align-items: center; gap: 20px; margin-left: auto; }
    .toggle { display: flex; align-items: center; gap: 9px; min-height: 44px; font-size: 13px; cursor: pointer; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); margin: 0; }
    details { position: relative; }
    summary { cursor: pointer; padding: 12px 0 12px 12px; min-height: 44px; font-size: 13px; }
    summary:hover, .toggle:hover { color: white; }
    summary:active { color: var(--blue); }
    .tweaks {
      position: absolute;
      right: 0;
      bottom: calc(100% + 12px);
      width: min(260px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid #404040;
      border-radius: 4px;
      background: #151515;
      box-shadow: 0 8px 24px #0006;
      z-index: 1;
    }
    .tweaks label { display: flex; justify-content: space-between; font-size: 13px; }
    input[type="range"] { display: block; width: 100%; min-height: 44px; margin: 8px 0 0; accent-color: var(--blue); }
    .tweaks p { font-size: 12px; margin: 6px 0 0; line-height: 1.6; color: var(--muted); }
    .controls[hidden] { display: none; }
    @media (max-width: 560px) {
      .caption { gap: 8px; flex-wrap: wrap; padding-bottom: 16px; }
      h1 { font-size: 14px; }
      .caption p { font-size: 11px; }
      .stage { margin-block: 28px; }
      .toolbar { gap: 4px; }
      .status { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header class="caption">
      <h1>主板 · 精细构图</h1>
      <p>平面俯视 / 构图 02</p>
    </header>
    <figure aria-labelledby="preview-caption">
      <div class="stage">
        <canvas role="img" aria-label="精细的深色平面主板，包含 CPU 插座、供电阵列、四条内存槽、PCIe 扩展槽、M.2 模组、芯片组、接口及密集贴片元件。蓝色光波沿板面与铜走线扩散。当前为静态构图。">
          深色平面电路板与蓝色光波的静态概念图。浏览器需支持 Canvas 才能查看。
        </canvas>
        <p class="fallback" hidden role="status">当前浏览器无法显示 Canvas 构图。请使用支持 Canvas 的浏览器打开此文件。</p>
        <noscript><p class="fallback">请启用 JavaScript 查看本地构图。文件不加载任何外部资源。</p></noscript>
      </div>
      <figcaption class="toolbar" id="preview-caption">
        <p class="status">构图 v0.2 · 原创主板概念，非实物或可生产设计</p>
        <div class="controls" hidden>
          <label class="toggle"><input id="waves-visible" type="checkbox" checked>显示光波</label>
          <details>
            <summary>Tweaks</summary>
            <div class="tweaks">
              <label for="intensity">光强 <output id="intensity-value" for="intensity">60%</output></label>
              <input id="intensity" type="range" min="0" max="100" value="60" step="5">
              <p>当前只确认构图与光感。节律、播放与进度控制将在动效版加入。</p>
            </div>
          </details>
        </div>
      </figcaption>
    </figure>
  </main>
  <script>
    (() => {
      'use strict';
      const W = 1600, H = 900;
      const BLUE = { h: 217.142857, s: 50.806452, l: 51.372549 };
      const BOARD = { x: 48, y: 36, w: 1504, h: 828 };
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const baseCanvas = document.createElement('canvas');
      const copperCanvas = document.createElement('canvas');
      const lightCanvas = document.createElement('canvas');
      const base = baseCanvas.getContext('2d');
      const copper = copperCanvas.getContext('2d');
      const light = lightCanvas.getContext('2d');
      if (![ctx, base, copper, light].every(Boolean)) {
        canvas.hidden = true;
        document.querySelector('.fallback').hidden = false;
        return;
      }
      const intensity = document.querySelector('#intensity');
      const visible = document.querySelector('#waves-visible');
      const sources = [
        { x: 657, y: 344, phase: 0, reach: 316, strength: 1 },
        { x: 1127, y: 651.5, phase: 250, reach: 225, strength: .72 },
        { x: 488, y: 352, phase: 120, reach: 158, strength: .58 },
        { x: 615, y: 196, phase: 330, reach: 162, strength: .48 },
        { x: 638, y: 521, phase: 190, reach: 176, strength: .54 },
        { x: 1258, y: 734, phase: 400, reach: 158, strength: .52 },
        { x: 231, y: 702, phase: 70, reach: 166, strength: .48 },
        { x: 1367, y: 390, phase: 290, reach: 172, strength: .52 }
      ];
      let scale = 1, compact = false, routeCount = 0, smdCount = 0;
      const cuts = [];
      const keepouts = [
        [100, 90, 220, 440], [354, 74, 419, 84],
        [394, 158, 393, 78], [391, 252, 112, 221],
        [521, 219, 274, 268], [919, 125, 244, 402],
        [1226, 163, 73, 330], [420, 489, 500, 66],
        [404, 567, 611, 49], [435, 638, 536, 27],
        [405, 683, 610, 43], [405, 763, 610, 38],
        [1041, 560, 175, 185], [1320, 559, 185, 160],
        [228, 550, 100, 100], [137, 654, 159, 94],
        [1216, 697, 88, 78], [1322, 344, 91, 92]
      ];
      function blue(l = BLUE.l, a = 1) { return 'hsla(' + BLUE.h + ',' + BLUE.s + '%,' + l + '%,' + a + ')'; }
      function line(c, points, color, width = 1) {
        c.beginPath();
        points.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
        c.strokeStyle = color; c.lineWidth = width; c.stroke();
      }
      function polygon(c, points, fill, stroke, width = 1) {
        c.beginPath();
        points.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
        c.closePath();
        if (fill) { c.fillStyle = fill; c.fill(); }
        if (stroke) { c.lineWidth = width; c.strokeStyle = stroke; c.stroke(); }
      }
      function box(c, x, y, w, h, fill, stroke, width = 1) {
        if (fill) { c.fillStyle = fill; c.fillRect(x, y, w, h); }
        if (stroke) { c.lineWidth = width; c.strokeStyle = stroke; c.strokeRect(x, y, w, h); }
      }
      function disc(c, x, y, radius, fill, stroke, width = 1) {
        c.beginPath(); c.arc(x, y, radius, 0, Math.PI * 2);
        if (fill) { c.fillStyle = fill; c.fill(); }
        if (stroke) { c.lineWidth = width; c.strokeStyle = stroke; c.stroke(); }
      }
      function boardPath(c) {
        const x = BOARD.x, y = BOARD.y, r = x + BOARD.w, b = y + BOARD.h;
        c.beginPath(); c.moveTo(x + 18, y); c.lineTo(r - 18, y);
        c.lineTo(r, y + 18); c.lineTo(r, b - 26); c.lineTo(r - 26, b);
        c.lineTo(x + 15, b); c.lineTo(x, b - 15); c.lineTo(x, y + 18); c.closePath();
      }
      function metal(x, y, w, h, dim = false) {
        const g = base.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, dim ? '#363636' : '#9d9d9d');
        g.addColorStop(.34, dim ? '#4a4a4a' : '#c7c7c7');
        g.addColorStop(.56, dim ? '#2d2d2d' : '#888888');
        g.addColorStop(1, dim ? '#414141' : '#b0b0b0');
        return g;
      }
      function label(text, x, y, size = 8, color = '#939393', rotate = 0) {
        base.save(); base.translate(x, y); base.rotate(rotate);
        base.font = size + 'px "SFMono-Regular", Consolas, monospace';
        base.fillStyle = color; base.fillText(text, 0, 0); base.restore();
      }
      function reserve(x, y, w, h) { cuts.push([x - 1, y - 1, w + 2, h + 2]); }
      function via(x, y, r = 1.65, bright = false) {
        disc(base, x, y, r, '#111111', bright ? '#787878' : '#424242', .7);
        disc(base, x, y, .55, '#090909');
        disc(copper, x, y, r + .25, null, blue(65), 1);
      }
      function route(points, index = 0, width = .65) {
        // Copper is a drawing, not a routed electrical design. Every bend is 45° / 90°.
        for (let i = 1; i < points.length; i++) {
          const dx = Math.abs(points[i][0] - points[i - 1][0]);
          const dy = Math.abs(points[i][1] - points[i - 1][1]);
          if (dx > .01 && dy > .01 && Math.abs(dx - dy) > .01) throw new Error('Non-octilinear route ' + routeCount);
        }
        line(base, points, index % 6 === 0 ? blue(24, .78) : blue(18, .66), width);
        line(copper, points, blue(63), width + .6);
        const p = points[points.length - 1]; via(p[0], p[1]); routeCount++;
      }
      function screw(x, y, radius = 5) {
        disc(base, x, y, radius + 1.8, '#161616', '#4c4c4c', .8);
        disc(base, x, y, radius, metal(x - radius, y - radius, radius * 2, radius * 2), '#aaaaaa', .5);
        line(base, [[x - radius * .5, y], [x + radius * .5, y]], '#292929', 1.2);
        line(base, [[x, y - radius * .5], [x, y + radius * .5]], '#292929', 1.2);
      }
      function smd(x, y, w = 9, h = 4, vertical = false, ceramic = false) {
        base.save(); base.translate(x, y); if (vertical) base.rotate(Math.PI / 2);
        box(base, -w / 2 - 1, -h / 2 - .7, w + 2, h + 1.4, '#363636');
        box(base, -w / 2, -h / 2, w, h, '#858585');
        box(base, -w / 2 + 2, -h / 2, w - 4, h, ceramic ? '#545454' : '#1c1c1c');
        line(base, [[-w / 2 + 2, -h / 2], [w / 2 - 2, -h / 2]], '#747474', .5);
        base.restore(); smdCount++;
      }
      function chip(x, y, w, h, pins = 12, mark = '') {
        reserve(x - w / 2 - 7, y - h / 2 - 7, w + 14, h + 14);
        box(base, x - w / 2 - 10, y - h / 2 - 10, w + 20, h + 20, null, '#626262', .55);
        for (let i = 0; i < pins; i++) {
          const dx = (i - (pins - 1) / 2) * (w - 8) / pins;
          const dy = (i - (pins - 1) / 2) * (h - 8) / pins;
          box(base, x + dx - .8, y - h / 2 - 6, 1.6, 7, '#a4a4a4');
          box(base, x + dx - .8, y + h / 2 - 1, 1.6, 7, '#8a8a8a');
          box(base, x - w / 2 - 6, y + dy - .8, 7, 1.6, '#929292');
          box(base, x + w / 2 - 1, y + dy - .8, 7, 1.6, '#929292');
        }
        box(base, x - w / 2, y - h / 2, w, h, '#181818', '#595959', .8);
        box(base, x - w / 2 + 2, y - h / 2 + 2, w - 4, h - 4, null, '#2b2b2b', .6);
        disc(base, x - w / 2 + 5, y - h / 2 + 5, 1.1, '#b0b0b0');
        if (mark) label(mark, x - w / 2 + 7, y + 2, Math.min(7.5, w / mark.length), '#858585');
      }
      function cap(x, y, radius = 11) {
        reserve(x - radius - 2, y - radius - 2, radius * 2 + 4, radius * 2 + 4);
        box(base, x - radius + 1, y - radius - 2, radius * 2 - 2, radius * 2 + 4, '#424242');
        disc(base, x, y, radius + 1, '#101010', '#535353', .8);
        disc(base, x, y, radius - 1, metal(x - radius, y - radius, radius * 2, radius * 2), '#999999', .6);
        disc(base, x, y, radius - 3, null, '#6f6f6f', .65);
        line(base, [[x - radius * .56, y], [x + radius * .56, y]], '#575757', .85);
        line(base, [[x, y - radius * .56], [x, y + radius * .56]], '#575757', .85);
      }
      function header(x, y, cols, rows = 2, pitch = 8, vertical = false) {
        base.save(); base.translate(x, y); if (vertical) base.rotate(Math.PI / 2);
        const w = cols * pitch + 9, h = rows * pitch + 8;
        box(base, -3, -3, w + 6, h + 6, '#343434', '#666666', .6);
        box(base, 0, 0, w, h, '#161616', '#555555', 1);
        box(base, 3, 3, w - 6, h - 6, '#090909', '#2e2e2e', .8);
        for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
          box(base, 7 + c * pitch, 6 + r * pitch, 3.1, 3.1, '#a9a9a9', '#c0c0c0', .35);
        }
        box(base, w / 2 - 5, -3, 10, 5, '#515151');
        base.restore();
        if (vertical) reserve(x - h - 4, y - 4, h + 8, w + 8);
        else reserve(x - 4, y - 4, w + 8, h + 8);
      }
      function powerSocket() {
        const x = 1238, y = 225, w = 46, h = 153;
        reserve(x - 6, y - 5, w + 14, h + 10);
        box(base, x - 4, y - 4, w + 8, h + 8, '#363636', '#8d8d8d', .7);
        box(base, x, y, w, h, '#292929', '#686868', .8);
        for (let row = 0; row < 12; row++) for (let col = 0; col < 2; col++) {
          const px = x + 6 + col * 19, py = y + 6 + row * 11.8;
          polygon(base, [[px + 2, py], [px + 12, py], [px + 12, py + 8], [px, py + 8], [px, py + 2]], '#080808', '#737373', .6);
          box(base, px + 3, py + 5, 5, 1.1, '#999999');
        }
        box(base, x - 7, y + h / 2 - 12, 7, 24, '#414141', '#959595', .6);
        line(base, [[x + 3, y + 2], [x + w - 3, y + 2]], '#a8a8a8', .7);
      }
      function heatsink(x, y, w, h, vertical = false) {
        reserve(x, y, w, h);
        box(base, x, y, w, h, metal(x, y, w, h, true), '#686868', .8);
        box(base, x + 4, y + 4, w - 8, h - 8, '#252525', '#555555', .7);
        if (vertical) {
          for (let a = x + 9; a < x + w - 7; a += 5) {
            line(base, [[a, y + 8], [a, y + h - 8]], '#111111', 2.4);
            line(base, [[a + 1.8, y + 8], [a + 1.8, y + h - 8]], '#5b5b5b', .6);
          }
        } else {
          for (let a = y + 10; a < y + h - 7; a += 5) {
            line(base, [[x + 8, a], [x + w - 8, a]], '#111111', 2.4);
            line(base, [[x + 8, a + 1.8], [x + w - 8, a + 1.8]], '#626262', .6);
          }
        }
        screw(x + 8, y + 8, 3.5); screw(x + w - 8, y + h - 8, 3.5);
      }
      function dimm(x, y, h, index) {
        reserve(x - 7, y - 16, 43, h + 33);
        const lightSlot = index % 2 === 1;
        box(base, x - 4, y - 3, 34, h + 6, '#343434', '#747474', .6);
        box(base, x, y, 26, h, lightSlot ? '#4a4a4a' : '#232323', '#727272', .8);
        box(base, x + 8, y + 8, 10, h - 16, '#090909', '#686868', .65);
        for (let i = 0; i < 90; i++) {
          const py = y + 12 + i * (h - 24) / 90;
          box(base, x + 4, py, 4, 1.15, '#a5a5a5');
          box(base, x + 18, py, 4, 1.15, '#989898');
        }
        box(base, x + 6, y + h * .56, 14, 5, '#808080');
        for (const py of [y - 13, y + h - 1]) {
          polygon(base, [[x - 3, py], [x + 29, py], [x + 26, py + 14], [x, py + 14]], lightSlot ? '#888888' : '#4a4a4a', '#a3a3a3', .6);
          box(base, x + 4, py + 3, 18, 5, '#333333');
        }
        label('DIMM_' + (index < 2 ? 'A' : 'B') + (index % 2 + 1), x + 36, y + 100, 7.3, '#a4a4a4', Math.PI / 2);
      }
      function pcie(x, y, w, reinforced = false) {
        reserve(x - 7, y - 4, w + 35, 36);
        box(base, x - 3, y - 3, w + 6, 31, '#212121', '#808080', .7);
        box(base, x, y, w, 25, reinforced ? metal(x, y, w, 25) : '#3d3d3d', '#8b8b8b', .7);
        box(base, x + 5, y + 7, w - 10, 11, '#080808', '#5e5e5e', .7);
        for (let i = 0; i < 112; i++) {
          const px = x + 9 + i * (w - 18) / 112;
          box(base, px, y + 5, 1.3, 4.7, '#ababab');
          box(base, px, y + 16.3, 1.3, 4.7, '#8e8e8e');
        }
        box(base, x + 69, y + 3, 7, 18, '#707070');
        polygon(base, [[x + w, y - 3], [x + w + 27, y - 3], [x + w + 21, y + 26], [x + w, y + 26]], '#3a3a3a', '#808080', .8);
        line(base, [[x + w + 5, y + 3], [x + w + 19, y + 3], [x + w + 15, y + 16]], '#a0a0a0', .7);
        screw(x + 4, y + 12, 1.6);
      }
      function socket() {
        const x = 537, y = 221, w = 244, h = 246;
        reserve(x - 13, y - 18, w + 33, h + 32);
        box(base, x - 10, y - 10, w + 20, h + 20, '#141414', '#747474', .65);
        box(base, x + 7, y + 7, w - 14, h - 14, '#353535', '#8c8c8c', .6);
        box(base, x + 18, y + 17, w - 36, h - 34, '#202020', '#676767', .8);
        for (let row = 0; row < 37; row++) for (let col = 0; col < 35; col++) {
          const px = x + 23 + col * 5.8, py = y + 22 + row * 5.5;
          if (col >= 11 && col <= 23 && row >= 12 && row <= 25) continue;
          line(base, [[px, py + 2], [px + 1.9, py], [px + 3.1, py + 1]], (row + col) % 4 ? '#777777' : '#adadad', .7);
        }
        // Exposed central package is deliberately conceptual, not a vendor CPU model.
        box(base, 618, 306, 79, 80, '#151515', '#777777', 1);
        box(base, 628, 316, 59, 60, '#1b1b1b', blue(36), .7);
        for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
          box(base, 633 + c * 10, 321 + r * 10, 7, 7, blue(18 + (c + r) % 3 * 3), '#373737', .35);
        }
        const rail = metal(x, y, w, h);
        polygon(base, [[x - 5, y + 5], [x + 15, y - 12], [x + w - 16, y - 12], [x + w + 4, y + 5], [x + w - 7, y + 20], [x + 6, y + 20]], rail, '#bdbdbd', .7);
        polygon(base, [[x - 5, y + h - 7], [x + 6, y + h - 21], [x + w - 7, y + h - 21], [x + w + 5, y + h - 7], [x + w - 15, y + h + 10], [x + 13, y + h + 10]], rail, '#bdbdbd', .7);
        box(base, x - 5, y + 5, 11, h - 12, rail, '#9c9c9c', .7);
        box(base, x + w - 7, y + 5, 11, h - 12, rail, '#9c9c9c', .7);
        line(base, [[x + w + 15, y + 9], [x + w + 15, y + h - 18], [x + w + 28, y + h - 5], [x + w + 28, y + h + 12], [x + w + 5, y + h + 12]], '#383838', 5);
        line(base, [[x + w + 15, y + 9], [x + w + 15, y + h - 18], [x + w + 28, y + h - 5], [x + w + 28, y + h + 12], [x + w + 5, y + h + 12]], '#adadad', 2.2);
        for (const p of [[x + 3, y - 3], [x + w - 3, y - 3], [x + 3, y + h + 2], [x + w - 3, y + h + 2]]) screw(...p, 5.4);
        polygon(base, [[x + 25, y + h + 21], [x + 34, y + h + 21], [x + 25, y + h + 12]], '#aeaeae');
        label('CPU SOCKET', x + 80, y + h + 29, 8.5, '#b1b1b1');
      }
      function drawCopper() {
        for (let i = 0; i < 50; i++) {
          const y = 258 + i * 3.7, knee = 819 + (i % 25) * 2.5;
          const turn = i < 25 ? -45 : 45;
          route([[779, y], [knee, y], [knee + 45, y + turn], [952 + i % 4 * 51, y + turn]], i, .7);
        }
        for (let i = 0; i < 46; i++) {
          const x = 554 + i * 4.2, knee = 479 + i % 12 * 2.3, dx = i < 23 ? -61 : 65;

      function waveRadius(age, reach) { return Math.max(0, Math.min(1, age / 1200)) * reach; }
      function drawWaveMask(source, age, amplitude) {
        if (age <= 0 || age >= 1200) return;
        const radius = waveRadius(age, source.reach);
        const width = source === sources[0] ? 29 : 20;
        const strength = Math.sin(Math.PI * age / 1200) * (1 - age / 1700) * source.strength * amplitude;

        g.addColorStop(.69, 'rgba(255,255,255,' + strength * .3 + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        disc(light, source.x, source.y, radius + width, g);

      function render() {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseCanvas, 0, 0);

        const power = Number(intensity.value) / 100;
        light.setTransform(1, 0, 0, 1, 0, 0); light.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
        light.setTransform(scale, 0, 0, scale, 0, 0);

        for (const source of sources) {
          const age = 830 - source.phase;
          drawWaveMask(source, age, 1); drawWaveMask(source, age - 160, .5);

        light.setTransform(1, 0, 0, 1, 0, 0);
        light.globalCompositeOperation = 'source-in'; light.drawImage(copperCanvas, 0, 0);
        light.globalCompositeOperation = 'source-over';

        ctx.setTransform(scale, 0, 0, scale, 0, 0);

          const glow = ctx.createRadialGradient(source.x, source.y, Math.max(0, r - band), source.x, source.y, r + band);
          glow.addColorStop(0, blue(BLUE.l, 0));
          glow.addColorStop(.52, blue(BLUE.l, .19 * source.strength * power));
          glow.addColorStop(1, blue(BLUE.l, 0));
          disc(ctx, source.x, source.y, r + band, glow);
          const local = ctx.createRadialGradient(source.x, source.y, 3, source.x, source.y, source === sources[0] ? 126 : 45);
          local.addColorStop(0, blue(62, .15 * power * source.strength));
          local.addColorStop(1, blue(BLUE.l, 0));
          disc(ctx, source.x, source.y, source === sources[0] ? 126 : 45, local);

      function selfCheck() {
        const assert = (ok, message) => { if (!ok) throw new Error('Motherboard v0.2: ' + message); };
        assert(W / H === 16 / 9, '画幅必须为 16:9');
        base.fillStyle = blue(); assert(base.fillStyle === '#4474c2', '主色不符');
        assert(sources.length === 8, '波源数量不符');
        assert(new Set(sources.map(s => s.phase)).size === sources.length, '错峰不得重合');
        assert(routeCount > 200, '关键走线缺失');
        assert(smdCount > 200, '元件绘制不完整');
        for (const s of sources) {
          assert(s.phase >= 0 && s.phase <= 400, '相位超出范围');
          assert(s.x > BOARD.x && s.x < BOARD.x + BOARD.w && s.y > BOARD.y && s.y < BOARD.y + BOARD.h, '波源越界');

      function resize() {

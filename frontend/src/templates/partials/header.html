<!-- 参考低空 header-utility / header-main / main-nav 分层；导航改为独立通栏。 -->
<header class="site-header{{headerState}}" id="site-top">
  <div class="container header-main">
    <a class="brand" href="index.html" aria-label="{{name}} 首页">
      <img class="brand-mark" src="{{logo}}" width="76" height="76" alt="{{logoAlt}}">
      <span class="brand-text"><span class="brand-title"><span class="university-name">河南大学</span><span class="brand-divider" aria-hidden="true"></span><span class="college-name">{{college}}</span></span><span class="college-english">{{english}}</span></span>
    </a>
    <span class="brand-motto" aria-hidden="true">{{motto}}</span>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" hidden><span class="sr-only">栏目导航</span><span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span></button>
  </div>
  <div class="navigation-band">
    <div class="container navigation-inner">
      <nav id="main-nav" class="main-nav" aria-label="主导航"><ul>{{navigation}}</ul></nav>
    </div>
  </div>
</header>

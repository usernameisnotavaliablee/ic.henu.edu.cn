<!doctype html>
<html lang="zh-CN" data-page="{{pageKind}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <script src="{{scroll_resetUrl}}"></script>
  <link rel="icon" href="assets/henu-logo.png">
  <link rel="stylesheet" href="{{styleUrl}}">
  <link rel="stylesheet" href="{{fontsUrl}}">
  <script src="{{media_loadingUrl}}" defer></script>
  <script src="{{header_motionUrl}}" defer></script>
  <script src="{{page_transitionUrl}}" defer></script>
  <script src="{{navigationUrl}}" defer></script>
  <script src="{{mainUrl}}" defer></script>
{{pageScripts}}
</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容</a>
  <div class="header-shell">{{header}}</div>
  <main id="main" tabindex="-1">{{content}}</main>
  {{footer}}
</body>
</html>

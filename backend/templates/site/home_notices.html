{% for item in notices %}<li><a href="{{ item.get_absolute_url }}"><span class="notice-index" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span><div><p class="notice-type">通知公告 / {{ item.date|date:"Y-m-d"|default:"日期待提供" }}</p><h3>{{ item.title }}</h3><p class="notice-summary">{{ item.summary }}</p></div></a></li>{% empty %}<li class="page-note">暂无已批准的通知。</li>{% endfor %}

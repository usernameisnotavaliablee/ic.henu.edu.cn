{% for item in news %}<a class="news-picture" data-news-panel href="{{ item.get_absolute_url }}"{% if not forloop.first %} hidden{% endif %}><span class="media-frame" data-media><img src="assets/{{ item.image }}" alt="{{ item.image_alt }}" width="720" height="480" loading="lazy">{% include "site/media_status.html" %}</span><span class="picture-note">{% if item.is_placeholder %}示意配图 · 待替换{% else %}开发预览{% endif %}</span><div class="picture-caption"><span>学院新闻 / {{ forloop.counter|stringformat:"02d" }}</span><h3>{{ item.title }}</h3></div></a>{% empty %}<p class="page-note">新闻配图将在内容批准后展示。</p>{% endfor %}

{% for teacher in teachers %}<a class="faculty-card" href="/{{ teacher.key }}.html">{% if teacher.image %}<span class="media-frame" data-media><img data-framed src="/assets/{{ teacher.image }}" alt="{{ teacher.title }}照片" width="100" height="132" loading="lazy"><span class="media-status" data-media-status hidden><span class="media-spinner" aria-hidden="true"></span><span data-media-label>图片加载中…</span></span></span>
{% endif %}<div><h3>{{ teacher.title }}</h3><p class="teacher-title">{{ teacher.subtitle }}</p><p class="teacher-intro">{{ teacher.summary }}</p><span class="teacher-link">查看教师介绍</span></div></a>
{% empty %}<div class="collection-empty-state"><p>相关内容正在整理中</p></div>{% endfor %}
